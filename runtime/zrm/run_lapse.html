<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 lapse</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 10px; }
  #out { white-space:pre-wrap; font:12px/1.45 Consolas, monospace;
         background:#11151b; border:1px solid #1e2732; border-radius:5px;
         padding:10px 12px; height:calc(100vh - 141px); overflow-y:auto; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #brand { text-align:center; padding:8px 10px; background:#0e1116;
           border-bottom:1px solid #1e2732; }
  #brand img { width:28px; height:28px; margin-right:8px; border-radius:50%;
               vertical-align:middle; }
  #brand b { font-size:15px; font-weight:700; letter-spacing:.14em;
             color:#e6ebf2; vertical-align:middle; }
</style>
</head>
<body>
<div id="brand"><img src="logo_raw.png" alt="" width="28" height="28"><b>RAW GAME</b></div>
<div id="wrap">
  <div id="state">loading lapse chain...</div>
  <div id="out"></div>
</div>
<script>
  window.PS4Runtime = window.PS4Runtime || {};
  window.PS4Runtime.selectedPayloadId = (new URLSearchParams(location.search || "")).get("payloadId") || "";
  window.PS4Runtime.selectedBackend = window.PS4Runtime.selectedBackend || "Lapse";
  window.PS4Runtime.backendEntered = true;
  window.PS4Runtime.pageName = "NEXT-ALT-RUNTIME";
  window.PS4Runtime.relativePath = location.pathname || "./runtime/zrm/run_lapse.html";
</script>
<script src="../../build.js"></script>
<script src="../../js/diagnostics.js"></script>
<script src="../../payloads/catalog.js"></script>
<script src="../../js/payload-loader.js"></script>
<script>
  if (window.PS4Diag) {
    window.PS4Diag.markPage("NEXT-ALT-RUNTIME", location.pathname || "./runtime/zrm/run_lapse.html");
    window.PS4Diag.markBackend({ selected: window.PS4Runtime.selectedBackend, entered: true, completed: false, failed: false });
  }
</script>
<script type="module">import "./chain_lapse.js";</script>
</body>
</html>
