name: NEXT Research Integrity

on:
  pull_request:
    paths:
      - 'runtime/next-1302/**'
      - 'tests/**'
      - '.github/workflows/research-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run NEXT research tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test-*.mjs; do
            echo "==> $test"
            node --experimental-default-type=module "$test"
          done
